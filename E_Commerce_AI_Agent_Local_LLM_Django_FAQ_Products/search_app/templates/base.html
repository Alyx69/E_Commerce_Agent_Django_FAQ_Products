<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>فروشگاه هوشمند</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    {% load static %}

    <!-- Vazirmatn — the premier Persian web font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Bootstrap 5 RTL -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'style.css' %}" />
  </head>

  <body>

    <!-- ── Navbar ── -->
    <header class="site-header">
      <div class="container">
        <div class="header-inner">
          <div class="brand">
            <span class="brand-icon">🛒</span>
            <span class="brand-name">فروشگاه هوشمند</span>
          </div>
          <nav class="header-nav">
            <a href="/" class="nav-link-pill active">خانه</a>
          </nav>
        </div>
      </div>
    </header>

    <!-- ── Flash messages ── -->
    {% if messages %}
      <div class="container mt-3">
        {% for message in messages %}
          <div class="alert-toast alert-toast--{{ message.tags }}">
            <span>{{ message }}</span>
            <button type="button" onclick="this.parentElement.remove()" class="toast-close">×</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <!-- ── Main content ── -->
    <main class="main-content">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="site-footer">
      <div class="container">
        <p>© ۱۴۰۳ فروشگاه هوشمند — جستجوی هوشمند با هوش مصنوعی</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
